<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daros - Painel</title>
<!-- Painel único: reúne as telas em abas dentro de uma só guia do navegador. -->
<style>
  :root{--pri:#0f766e;--pri2:#115e59;--bd:#e5e7eb}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column;background:#f4f5f7}
  nav{background:var(--pri2);display:flex;gap:2px;padding:6px 10px 0;overflow-x:auto;flex:none}
  nav button{font:inherit;border:0;background:transparent;color:#d1fae5;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
  nav button:hover{background:rgba(255,255,255,.12)}
  nav button.on{background:#f4f5f7;color:var(--pri2);font-weight:700}
  iframe{flex:1;width:100%;border:0;display:none;background:#f4f5f7}
  iframe.on{display:block}
</style>
</head>
<body>
<nav id="abas"></nav>
<div id="frames" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script>
(function(){
  const ABAS=[["buscar","Buscar imóveis","buscar.html"],["clientes","Clientes","clientes.html"],
              ["docs","Documentações","documentos.html"],["rel","Relatório","relatorio.html"]];
  const nav=document.getElementById("abas"), box=document.getElementById("frames");
  function abrir(id){
    ABAS.forEach(([k,,src])=>{
      const b=nav.querySelector(`[data-k=${k}]`); b.classList.toggle("on",k===id);
      let f=box.querySelector(`[data-k=${k}]`);
      if(k===id && !f){ f=document.createElement("iframe"); f.dataset.k=k; f.src=src; box.appendChild(f); }   // carrega só quando abre
      if(f) f.classList.toggle("on",k===id);
    });
    try{ localStorage.setItem("aba_ativa",id); }catch(e){}
    location.hash=id;
  }
  ABAS.forEach(([k,t])=>{ const b=document.createElement("button"); b.dataset.k=k; b.textContent=t; b.onclick=()=>abrir(k); nav.appendChild(b); });
  let ini=location.hash.slice(1); if(!ABAS.some(a=>a[0]===ini)){ try{ini=localStorage.getItem("aba_ativa");}catch(e){} }
  abrir(ABAS.some(a=>a[0]===ini)?ini:"buscar");
})();
</script>
</body>
</html>
